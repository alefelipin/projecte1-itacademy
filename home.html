<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Wallpoet&display=swap" rel="stylesheet">
    
  <link rel="stylesheet" href="./css/main.css">

</head>
<body class="page-home">
  <header class="home-header">
    <div class="home-header-container">
      <h1 class="home-title">Home</h1>
      <div class="home-header-right">
        <img 
          class="home-header-icon" 
          src="./src/assets/icons/align-bottom.svg" 
          alt=""
        >
        <img 
          class="home-header-avatar" 
          src="./src/assets/images/avatar.svg" 
          alt="foto de perfil"
        >
      </div> 
    </div>
    <form class="home-header-form">
      <div class="home-header-field">
        <div class="header-icon-wrapper">
          <img 
            class="home-form-icon" 
            src="./src/assets/icons/search.svg" 
            alt=""
          >
        </div> 
        <input
          class="home-input"
          type="text" 
          placeholder="Search alumni..." 
          required
        >
      </div>
    </form>
  </header>
  <main class="home-main">
    <section class="home-main-container">
      <div class="home-main-card">
        <img 
            class="home-main-image" 
            src="./src/assets/images/image20.png" 
            alt="Networking"
          >
        <h2 class="home-card-title">
          Networking
        </h2>
        <p class="home-card-text">
          Connect with professionals in your field
        </p>
        <button 
          class="btn btn--home btn--white btn--font-xsmall" 
          type="button"
        >
          Explore
        </button>
      </div>
      <div class="home-main-card">
        <img 
            class="home-main-image"
            src="./src/assets/images/image20.png" 
            alt="Job Opportunities"
          >
        <h2 class="home-card-title">
          Job Opportunities
        </h2>
        <p class="home-card-text">
          Discover openings tailored to your skills
        </p>
        <button 
          class="btn btn--home btn--white btn--font-xsmall" 
          type="button"
        >
          Search Jobs
        </button>
      </div>
    </section>
  </main>

  <footer class="mobile-footer">
    <section class="mobile-footer-container">
      <div class="mobile-footer-item">
        <img 
          class="mobile-footer-icon" 
          src="./src/assets/icons/home.svg" 
          alt="">
        <p class="mobile-footer-text">
          Home
        </p> 
      </div>
      <div class="mobile-footer-item">
        <img 
          class="mobile-footer-icon" 
          src="./src/assets/icons/network.svg" 
          alt="">
        <p class="mobile-footer-text">
          Networking
        </p> 
      </div>
      <div class="mobile-footer-item">
        <img 
          class="mobile-footer-icon" 
          src="./src/assets/icons/briefcase.svg" 
          alt="">
        <p class="mobile-footer-text">
          Job Portal
        </p> 
      </div>
      <div class="mobile-footer-item">
        <img 
          class="mobile-footer-icon" 
          src="./src/assets/icons/profile.svg" 
          alt="">
        <p class="mobile-footer-text">
          Profile
        </p> 
      </div>
    </section>
  </footer>
  
</body>
</html>
