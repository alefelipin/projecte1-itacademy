<!DOCTYPE html>
<html lang="cat">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea un compte</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Wallpoet&display=swap">

  <link rel="stylesheet" href="./css/main.css">

</head>
<body class="page-signup">
  <main class="signup-main">
    <section class="signup" aria-labelledby="signup-title">
      <div class="signup-container">
        <h1 id="signup-title" class="signup-title">
          Crea un compte
        </h1>
        <form class="signup-form">
          <div class="signup-fields">
            <div class="signup-field">
              <img class="signup-icon" src="./src/assets/icons/User.svg" alt="">
              <input
                class="signup-input"
                type="text" 
                placeholder="Posa el teu nom" 
                required
              >
            </div>
            <div class="signup-field">
              <img class="signup-icon" src="./src/assets/icons/User.svg" alt="">
              <input
              class="signup-input"
              type="text" 
              placeholder="Posa el teu cognom" 
              required
              >
            </div>
            <div class="signup-field">
              <img class="signup-icon" src="./src/assets/icons/Mail.svg" alt="">
              <input
              class="signup-input"
              type="email" 
              placeholder="El teu correu electrònic" 
              required
              >
            </div>
            <div class="signup-field">
              <img class="signup-icon" src="./src/assets/icons/Frame.svg" alt="">
              <input
              class="signup-input"
              type="password" 
              placeholder="Crea una contrasenya" 
              required
              >
            </div> 
          </div>
          <div class="signup-terms">
            <input id="terms" type="checkbox" required>
            <label for="terms">Accepto els Termes i Condicions</label>
          </div>
          <div class="signup-button-container">
            <button class="btn signup-button btn--rounded btn--colored-dark btn--font-medium" type="submit">
              Registra't
            </button>
          </div>
        </form> 
      </div>
    </section>
    <div class="signup-separator">
      <span>O</span>
    </div>
    <section class="signup-social">
      <div class="signup-social-card signup-by-social-card--apple">
        <img class="signup-icon" src="./src/assets/icons/Apple.svg" alt="">
        <button class="btn btn--social btn--apple btn--rounded btn--font-medium" type="button">
          Continua amb Apple
        </button>
      </div>
      <div class="signup-social--card signup-by-social-card--google">
        <img class="signup-icon" src="./src/assets/icons/Google.svg" alt="">
        <button class="btn btn--social btn--google btn--rounded btn--font-medium" type="button">
          Continua amb Google
        </button>
      </div>
      <div class="signup-social--card signup-by-social-card--facebook">
        <img class="signup-icon" src="./src/assets/icons/Facebook.svg" alt="">
        <button class="btn btn--social btn--facebook btn--rounded btn--font-medium" type="button">
          Continua amb Facebook
        </button>
      </div>
    </section>
    <section class="login" aria-labelledby="login-title">
      <div class="login-container">
        <p id= "login-title" class="login-title">
          Ja t'has registrat?
        </p>
        <a href="#" class="login-link">
          Inicia sessió
        </a>
      </div>
    </section>
  </main>
</body>
</html>
